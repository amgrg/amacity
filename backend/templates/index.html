<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amacity </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            min-height: 100%;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .search-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }
        .logo {
            width: 250px;
            height: auto;
            margin-bottom: 2rem;
        }
        .search-box {
            width: 100%;
            max-width: 584px;
        }
        .search-results {
            margin-top: 2rem;
            width: 100%;
            max-width: 800px;
        }
        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #dee2e6;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: white;
        }
        .item-info {
            flex-grow: 1;
        }
        .item-name {
            font-weight: bold;
            margin-right: 10px;
        }
        .item-price {
            font-weight: bold;
            color: #28a745;
        }
        .item-shop {
            color: #6c757d;
        }

        /* Featured Products Section */
        .featured-section {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 3rem;
            padding: 0 20px;
        }
        .featured-title {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .featured-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .featured-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        .featured-card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
            min-height: 2.5rem;
        }
        .featured-card-description {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.75rem;
            min-height: 2.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .featured-card-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 0.5rem;
        }
        .featured-card-shop {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
        .featured-card-category {
            display: inline-block;
            background: #e7f3ff;
            color: #0066cc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
        .featured-card-btn {
            width: 100%;
            background: linear-gradient(90deg, #4285F4, #34A853);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }
        .featured-card-btn:hover {
            opacity: 0.9;
        }
        .loading-spinner {
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="container search-container">
        <svg class="logo" viewBox="0 0 500 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
                </linearGradient>
            </defs>
            <path d="M10,50 Q50,10 90,50 T170,50" stroke="url(#gradient)" stroke-width="8" fill="none" />
            <text x="190" y="70" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#4285F4">Amacity</text>
        </svg>

        <!-- Featured Products Section -->
        <div class="featured-section" id="featured-section">
            <h2 class="featured-title">Prodotti in Evidenza</h2>
            <div class="featured-grid" id="featured-grid">
                <!-- Featured products will be loaded here -->
                <div class="loading-spinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Caricamento...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" class="form-control form-control-lg" placeholder="Cerca prodotti...">
        </div>
        <div class="mt-3">
            <button id="test-db-btn" class="btn btn-secondary">Test Database</button>
        </div>
        <div class="search-results" id="search-results">
            <!-- Search results will be dynamically added here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const testDbBtn = document.getElementById('test-db-btn');
            const featuredGrid = document.getElementById('featured-grid');

            // Load featured products on page load
            loadFeaturedProducts();

            searchInput.addEventListener('input', debounce(function(event) {
                const query = event.target.value;
                if (query && query.trim().length > 1) {
                    fetchSearchResults(query.trim());
                } else {
                    searchResults.innerHTML = '';
                }
            }, 300));

            testDbBtn.addEventListener('click', testDatabase);

            function loadFeaturedProducts() {
                console.log('Loading featured products...');
                fetch('/api/featured')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log(`Received ${data.length} featured products`);
                        displayFeaturedProducts(data);
                    })
                    .catch(error => {
                        console.error('Error loading featured products:', error);
                        featuredGrid.innerHTML = '<p class="text-center text-danger">Errore nel caricamento dei prodotti in evidenza</p>';
                    });
            }

            function displayFeaturedProducts(products) {
                featuredGrid.innerHTML = '';
                if (products.length === 0) {
                    featuredGrid.innerHTML = '<p class="text-center">Nessun prodotto disponibile</p>';
                    return;
                }

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'featured-card';
                    card.innerHTML = `
                        <div class="featured-card-category">${product.category}</div>
                        <div class="featured-card-title">${product.name}</div>
                        <div class="featured-card-description">${product.description}</div>
                        <div class="featured-card-price">€${product.price.toFixed(2)}</div>
                        <div class="featured-card-shop">📍 ${product.shop_name}</div>
                        <button class="featured-card-btn checkout-btn" data-item-id="${product.id}" data-shop-id="${product.shop_id}">
                            Acquista Ora
                        </button>
                    `;
                    featuredGrid.appendChild(card);
                });

                // Add event listeners to featured checkout buttons
                document.querySelectorAll('.featured-card-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const itemId = this.getAttribute('data-item-id');
                        const shopId = this.getAttribute('data-shop-id');
                        console.log(`Checkout clicked for item ${itemId} from shop ${shopId}`);
                        alert(`Checkout avviato per il prodotto #${itemId} dal negozio #${shopId}`);
                    });
                });
            }

            function fetchSearchResults(query) {
                console.log(`Fetching results for query: ${query}`);
                searchResults.innerHTML = '<p>Searching...</p>';
                fetch(`/api/search?q=${encodeURIComponent(query)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log(`Received ${data.length} results`);
                        displayResults(data);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        searchResults.innerHTML = `<p>Error: ${error.message}</p>`;
                    });
            }

            function displayResults(data) {
                searchResults.innerHTML = '';
                if (data.length === 0) {
                    searchResults.innerHTML = '<p>No results found</p>';
                } else {
                    data.forEach(item => {
                        const itemElement = document.createElement('div');
                        itemElement.className = 'item-card';
                        itemElement.innerHTML = `
                            <div class="item-info">
                                <span class="item-name">${item.name}</span>
                                <span class="item-price">€${item.price.toFixed(2)}</span>
                                <span class="item-shop">at ${item.shop_name}</span>
                            </div>
                            <button class="btn btn-primary btn-sm checkout-btn" data-item-id="${item.id}" data-shop-id="${item.shop_id}">Checkout</button>
                        `;
                        searchResults.appendChild(itemElement);
                    });

                    // Add event listeners to checkout buttons
                    document.querySelectorAll('.checkout-btn').forEach(button => {
                        button.addEventListener('click', function() {
                            const itemId = this.getAttribute('data-item-id');
                            const shopId = this.getAttribute('data-shop-id');
                            console.log(`Checkout clicked for item ${itemId} from shop ${shopId}`);
                            // Here you would typically initiate the checkout process
                            alert(`Checkout initiated for item ${itemId} from shop ${shopId}`);
                        });
                    });
                }
            }

            function testDatabase() {
                console.log("Testing database connection...");
                searchResults.innerHTML = '<p>Testing database...</p>';
                fetch('/api/test_db')
                    .then(response => response.json())
                    .then(data => {
                        console.log("Database test results:", data);
                        let resultHtml = `
                            <h4>Database Test Results:</h4>
                            <p>Items Count: ${data.items_count}</p>
                            <p>Shops Count: ${data.shops_count}</p>
                        `;
                        if (data.sample_item) {
                            resultHtml += `
                                <h5>Sample Item:</h5>
                                <p>Name: ${data.sample_item.name}</p>
                                <p>Price: €${data.sample_item.price.toFixed(2)}</p>
                            `;
                        }
                        searchResults.innerHTML = resultHtml;
                    })
                    .catch(error => {
                        console.error('Error testing database:', error);
                        searchResults.innerHTML = `<p>Error testing database: ${error.message}</p>`;
                    });
            }

            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func.apply(this, args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }
        });
    </script>
</body>
</html>
